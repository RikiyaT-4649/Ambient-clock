<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ambient Clock</title>

    <meta name="description" content="A relaxing ambient clock that visualizes real-time weather and star positions.">

    <meta property="og:title" content="Ambient Clock"> <meta property="og:description" content="A relaxing ambient clock that visualizes real-time weather and star positions.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ambient-clock-inky.vercel.app">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
    <script src="stars.js"></script>

</head>
<body>

    <div id="bg-container"></div>
    <canvas id="particle-canvas"></canvas>
    <div id="sky-cover-overlay"></div>
    <div id="celestial-body"></div>
    <canvas id="cloud-canvas"></canvas>

    <div id="dimmer-overlay"></div>

    <div id="clock-container" title="Double-click for fullscreen">
        <div id="time">00:00:00</div>
        <div id="date">LOADING...</div>

        <!-- Weather display area -->
        <div id="weather-display">
            <div id="weather-location">
                --
            </div>
            <span id="weather-temp">--°C</span>
            <div id="weather-desc">
                Loading...
            </div>
            <div id="sun-times">
                ☀️ -- | 🌙 --
            </div>
        </div>

        <!-- Analog clock -->
        <div id="analog-clock">
            <div class="clock-center"></div>
            <div class="clock-hand hour-hand" id="hour-hand"></div>
            <div class="clock-hand minute-hand" id="minute-hand"></div>
            <div class="clock-hand second-hand" id="second-hand"></div>
        </div>
    </div>

    <div id="controls-wrapper">
        <div id="controls">
            <!-- AUDIO CONTROLS -->
            <div class="icon" id="btn-sound" title="Rain Sound">🔊</div>

            <div class="divider"></div>

            <div class="control-group">
                <div class="icon dimmer-icon">💡</div>
                <input type="range" id="dimmer-range" min="0" max="0.9" step="0.01" value="0" title="Screen brightness">
            </div>

            <div class="divider"></div>

            <div class="icon" id="btn-clock-toggle" title="Toggle clock">🕐</div>

            <div class="divider"></div>

            <div class="icon" id="btn-star-labels" title="Show star names">⭐</div>

            <div class="divider"></div>

            <button class="btn-text" id="btn-wakelock">Always On OFF</button>
        </div>
    </div>

    <!-- Tools panel -->
    <div id="tools-panel">
        <div class="tool-section">
            <div class="tool-title">Pomodoro Timer</div>
            <div class="pomodoro-status" id="pomodoro-status">Ready</div>
            <div class="pomodoro-display" id="pomodoro-time">25:00</div>
            <div class="tool-buttons">
                <button class="tool-btn" id="pomodoro-start">Start</button>
                <button class="tool-btn" id="pomodoro-reset">Reset</button>
            </div>
        </div>
        <div class="tool-section">
            <div class="tool-title">Alarm</div>
            <input type="time" class="alarm-input" id="alarm-time" value="07:00" aria-label="Set alarm time" title="Set alarm time">
            <div class="tool-buttons">
                <button class="tool-btn" id="alarm-toggle">ON</button>
            </div>
        </div>
    </div>

    <!-- Shortcut hints -->
    <div class="shortcut-hint" id="shortcut-hint">
        T: Tools | Space: Toggle UI | F: Fullscreen
    </div>

    <!-- AUDIO ELEMENTS -->
    <audio id="audio-rain" loop src="rain.mp3"></audio>

    <script src="app.js"></script>
</body>
</html>
